<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xưởng Cào — Quản lý đơn sản xuất</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --paper:#F2F1EC;
  --panel:#FFFFFF;
  --ink:#1F2A24;
  --ink-soft:#54615A;
  --line:#D8D5CB;
  --berry:#7A2048;
  --berry-dark:#5C1836;
  --steel:#5C6B66;
  --forest:#3F6E52;
  --ochre:#B5792B;
  --rust:#A83E2C;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Oswald',sans-serif;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---- App shell ---- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:220px;flex-shrink:0;
  background:var(--ink);
  color:#EDEAE1;
  display:flex;flex-direction:column;
  padding:22px 0;
}
.brand{
  padding:0 20px 22px 20px;
  border-bottom:1px solid rgba(255,255,255,.12);
  margin-bottom:14px;
}
.brand .mark{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;
  letter-spacing:.03em;color:#fff;
  display:flex;align-items:center;gap:8px;
}
.brand .mark svg{flex-shrink:0;}
.brand .sub{font-size:11px;color:#9BA69F;margin-top:4px;letter-spacing:.03em;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 20px;
  font-size:14px;font-weight:500;
  color:#C7CDC5;
  border-left:3px solid transparent;
  cursor:pointer;
  transition:background .15s;
}
.nav-item:hover{background:rgba(255,255,255,.05);}
.nav-item.active{
  color:#fff;background:rgba(255,255,255,.08);
  border-left-color:var(--berry);
}
.nav-item .n{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7F8B84;width:16px;
}
.nav-item.active .n{color:var(--berry);}

.main{flex:1;padding:32px 40px;max-width:1180px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:26px;margin:0;color:var(--ink);}
.topbar .meta{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.btn{
  border:none;border-radius:2px;padding:10px 18px;
  font-size:13px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;
}
.btn-primary{background:var(--berry);color:#fff;}
.btn-primary:hover{background:var(--berry-dark);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-sm{padding:6px 12px;font-size:11px;}
.btn-danger{background:transparent;color:var(--rust);border:1px solid var(--rust);}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:3px;
  padding:22px;
  margin-bottom:20px;
}
.card h2{font-size:14px;color:var(--ink-soft);margin:0 0 16px 0;letter-spacing:.06em;}

.field-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.field{flex:1;min-width:160px;display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:2px;
  padding:9px 10px;font-size:14px;color:var(--ink);
  background:#FDFCFA;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--berry);outline-offset:-1px;border-color:var(--berry);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-soft);border-bottom:2px solid var(--ink);padding:8px 10px;
}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.num{text-align:right;font-family:'IBM Plex Mono',monospace;}

.status-badge{
  display:inline-block;padding:3px 10px;border-radius:20px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
}
.status-draft{background:#EDEAE1;color:var(--ink-soft);}
.status-production{background:#F1E1CB;color:var(--ochre);}
.status-completed{background:#DCE9E1;color:var(--forest);}
.status-invoiced{background:#EBD9E1;color:var(--berry);}
.status-paid{background:#D6E5DB;color:var(--forest);}

.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);}
.empty .stamp{
  display:inline-block;border:2px solid var(--line);border-radius:6px;
  padding:6px 16px;font-family:'Oswald',sans-serif;letter-spacing:.08em;
  color:var(--line);text-transform:uppercase;font-size:12px;margin-bottom:10px;
  transform:rotate(-4deg);
}

.line-item-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap;}
.line-item-row .field{min-width:120px;}
.line-item-row .rm{color:var(--rust);background:none;border:none;font-size:18px;padding:8px;}

.totals{margin-top:10px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.totals .row{display:flex;gap:24px;font-size:14px;width:260px;justify-content:space-between;}
.totals .grand{font-size:18px;font-weight:700;border-top:1px solid var(--ink);padding-top:8px;margin-top:2px;}

/* stamp badge — signature element */
.stamp-mark{
  position:relative;display:inline-flex;align-items:center;gap:6px;
  border:2px solid var(--forest);color:var(--forest);
  padding:4px 12px;border-radius:4px;transform:rotate(-3deg);
  font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.06em;
  font-size:11px;text-transform:uppercase;
}
.stamp-mark.rust{border-color:var(--rust);color:var(--rust);}

/* ---- Invoice / print ---- */
.invoice-sheet{
  background:#fff;padding:48px;max-width:780px;margin:0 auto;
  border:1px solid var(--line);
}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--ink);padding-bottom:18px;margin-bottom:24px;}
.inv-head .company{font-size:13px;line-height:1.55;color:var(--ink-soft);}
.inv-head .company strong{color:var(--ink);font-size:15px;}
.inv-head .doc-title{text-align:right;}
.inv-head .doc-title .t{font-size:30px;color:var(--berry);}
.inv-head .doc-title .num{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink-soft);margin-top:2px;}
.inv-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px;}
.inv-meta-grid .block h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 6px 0;}
.inv-meta-grid .block .kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dotted var(--line);}
.inv-table{width:100%;border-collapse:collapse;margin-bottom:18px;}
.inv-table th{border-bottom:2px solid var(--ink);}
.inv-table td{border-bottom:1px solid var(--line);}
.inv-pay{background:#F7F5F0;border:1px solid var(--line);padding:16px 18px;border-radius:3px;margin-top:8px;}
.inv-pay .kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.inv-pay .kv.big{font-size:16px;font-weight:700;border-top:1px solid var(--ink);margin-top:6px;padding-top:8px;}
.inv-foot{margin-top:30px;font-size:11px;color:var(--ink-soft);text-align:center;}

.modal-backdrop{position:fixed;inset:0;background:rgba(31,42,36,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:50;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;max-width:780px;margin-left:auto;margin-right:auto;}

.toast{
  position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:3px;font-size:13px;z-index:100;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
}

/* ---- Lock screen ---- */
.lock-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--ink);padding:20px;
}
.lock-card{
  background:var(--panel);border-radius:6px;padding:36px 32px;
  width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);
  text-align:center;
}
.lock-card h2{font-size:18px;margin:0 0 8px 0;color:var(--ink);}
.lock-card .field{text-align:left;margin-bottom:0;}
.lock-card .field label{margin-bottom:5px;display:block;}
.lock-card .meta{font-size:12px;color:var(--ink-soft);line-height:1.5;}
.lock-card input{width:100%;text-align:center;letter-spacing:.2em;font-family:'IBM Plex Mono',monospace;}
.sidebar-lock{
  margin-top:auto;padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);
  font-size:12px;color:#9BA69F;cursor:pointer;
}
.sidebar-lock:hover{color:#fff;}

@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
  .invoice-sheet{border:none;padding:0;max-width:none;}
  .modal-backdrop{position:static;background:none;padding:0;display:block;}
}

@media (max-width:820px){
  #app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:10px;}
  .brand{display:none;}
  .nav-item{padding:8px 14px;border-left:none;border-bottom:3px solid transparent;white-space:nowrap;}
  .nav-item.active{border-bottom-color:var(--berry);}
  .main{padding:20px;}
  .inv-meta-grid{grid-template-columns:1fr;}
  .inv-head{flex-direction:column;gap:14px;}
  .inv-head .doc-title{text-align:left;}
}
</style>
</head>

// ---------------- Google Drive storage ----------------
const DRIVE_FILE_NAME = 'vinafix-data.json';
let driveAccessToken = null;
let driveFileId = null;
let driveDoc = null;
let driveLoadPromise = null;

async function driveApiFetch(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + driveAccessToken });
  const res = await fetch(url, options);
  if(!res.ok){ throw new Error('Drive API lỗi ' + res.status); }
  return res;
}

async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function driveCreateFile(initialContent){
  const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
  const boundary = 'vinafixBoundary';
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(initialContent)}\r\n` +
    `--${boundary}--`;
  const res = await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  const data = await res.json();
  return data.id;
}

async function driveDownloadFile(fileId){
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  const text = await res.text();
  try{ return JSON.parse(text); }catch(e){ return {}; }
}

async function driveUploadFile(fileId, content){
  await driveApiFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method:'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(content)
  });
}

async function driveEnsureLoaded(){
  if(driveDoc) return driveDoc;
  if(!driveLoadPromise){
    driveLoadPromise = (async ()=>{
      driveFileId = await driveFindFile();
      if(driveFileId){
        driveDoc = await driveDownloadFile(driveFileId);
      } else {
        driveDoc = {};
        driveFileId = await driveCreateFile(driveDoc);
      }
      return driveDoc;
    })();
  }
  return driveLoadPromise;
}

async function driveSave(){
  if(!driveFileId) return false;
  try{ await driveUploadFile(driveFileId, driveDoc); return true; }
  catch(e){ console.error('drive save failed', e); return false; }
}

async function sGet(key, fallback){
  if(!driveAccessToken) return fallback;
  try{
    const doc = await driveEnsureLoaded();
    return (doc[key] !== undefined && doc[key] !== null) ? doc[key] : fallback;
  }catch(e){ console.error('drive get failed', key, e); return fallback; }
}
async function sSet(key, value){
  if(!driveAccessToken) return false;
  try{
    await driveEnsureLoaded();
    driveDoc[key] = value;
    return await driveSave();
  }catch(e){ console.error('drive set failed', key, e); return false; }
}

function getISOWeek(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(),0,1);
  return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

function fmtMoney(n){
  return (Math.round(n*100)/100).toLocaleString('fi-FI',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('fi-FI');
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso, n){
  const d = new Date(iso); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

// Finnish reference number (viitenumero) checksum algorithm
function finnishReference(numStr){
  const digits = numStr.replace(/\D/g,'');
  const weights = [7,3,1];
  let sum = 0;
  const rev = digits.split('').reverse();
  for(let i=0;i<rev.length;i++){
    sum += parseInt(rev[i],10) * weights[i % 3];
  }
  const check = (10 - (sum % 10)) % 10;
  return digits + check;
}
function formatReference(ref){
  // group in blocks of 5 from the right, RF-style spacing for readability
  const rev = ref.split('').reverse().join('');
  const grouped = rev.match(/.{1,5}/g).join(' ');
  return grouped.split('').reverse().join('');
}

let toastTimer = null;
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast'; t.className='toast no-print';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2200);
}

// ---------------- Dashboard ----------------
function statusLabel(s){
  return { draft:T('status_draft'), production:T('status_production'), completed:T('status_completed'), invoiced:T('status_invoiced'), paid:T('status_paid') }[s] || s;
}

async function sendCompletionEmail(order){
  const url = state.settings.appsScriptUrl;
  if(!url) return;
  const customer = state.customers.find(c=>c.id===order.customerId);
  const email = customer?.email;
  if(!email) return;
  try{
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action:'notifyCompletion',
        to: email,
        orderNumber: order.orderNumber,
        customerName: order.customerName || customer?.name || '',
      })
    });
    const data = await res.json().catch(()=>({ok:false}));
    showToast(data.ok ? T('toast_completion_email_sent') : T('toast_completion_email_failed'));
  }catch(err){
    showToast(T('toast_completion_email_failed'));
  }
}

function orderTotal(order){
  const subtotal = order.lines.reduce((a,l)=>a + l.qty*l.unitPrice, 0);
  const vat = subtotal * (order.vatRate ?? state.settings.vatRate) / 100;
  return { subtotal, vat, total: subtotal+vat };
}

function renderDashboard(){
  const orders = [...state.orders].sort((a,b)=>{
    const da = a.deliveryDueDate, db = b.deliveryDueDate;
    if(da && db) return da.localeCompare(db);
    if(da && !db) return -1;
    if(!da && db) return 1;
    return (b.orderNumber||'').localeCompare(a.orderNumber||'');
  });
  const rows = orders.map(o=>{
    const t = orderTotal(o);
    const wk = getISOWeek(o.deliveryDueDate);
    return `<tr data-order="${o.id}">
      <td class="mono">${o.orderNumber}</td>
      <td>${o.customerName || '—'}</td>
      <td>${o.deliveryDueDate ? `${fmtDate(o.deliveryDueDate)} <span class="meta" style="font-size:11px;">(${T('lbl_week_of')} ${wk})</span>` : `<span class="meta">${T('no_due_date')}</span>`}</td>
      <td class="num">${fmtMoney(t.total)}</td>
      <td><span class="status-badge status-${o.status}">${statusLabel(o.status)}</span></td>
      <td style="text-align:center;"><input type="checkbox" class="act-paid" data-id="${o.id}" ${o.paid?'checked':''} style="width:18px;height:18px;cursor:pointer;"></td>
      <td style="text-align:right;">
        <button class="btn btn-ghost btn-sm act-view" data-id="${o.id}">${T('btn_view')}</button>
        <button class="btn btn-ghost btn-sm act-status" data-id="${o.id}">${T('btn_change_status')}</button>
        <button class="btn btn-danger btn-sm act-del" data-id="${o.id}">${T('btn_delete')}</button>

  const totalRevenue = orders.filter(o=>o.status!=='draft').reduce((a,o)=>a+orderTotal(o).total,0);
  const pending = orders.filter(o=>o.status==='production').length;

  const activeOrders = orders.filter(o=>o.status==='draft' || o.status==='production');
  const queueLines = [];
  activeOrders.forEach(o=>{
    (o.lines||[]).forEach(l=>{
      queueLines.push({ orderNumber:o.orderNumber, customerName:o.customerName, name:l.name, material:l.material, qty:l.qty, status:o.status });

  const totalQueueQty = queueLines.reduce((a,l)=>a+(l.qty||0),0);
  const queueRows = queueLines.map(l=>`
    <tr>
      <td class="mono">${l.orderNumber}</td>

      <td>${l.name}</td>

    </tr>`).join('');

  const html = `
    <div class="topbar">
      <div>
        <h1>${T('dash_title')}</h1>
        <div class="meta">${orders.length} ${T('dash_orders')} &nbsp;·&nbsp; ${pending} ${T('dash_inprod')} &nbsp;·&nbsp; ${T('dash_revenue')}: ${fmtMoney(totalRevenue)}</div>
      </div>
      <button class="btn btn-primary" id="go-new-order">${T('dash_new_order')}</button>
    </div>
    ${state.pendingOrders.length ? `
    <div class="card" style="border-color:var(--ochre);">
      <h2 style="color:var(--ochre);">${T('pending_title')} (${state.pendingOrders.length})</h2>
      ${state.pendingOrders.map(p=>`
        <div style="border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:10px;">
          <div class="field-row" style="margin-bottom:8px;">
            <div class="field"><label>${T('pending_material')}</label><div>${p.material==='inox'?T('opt_inox'):T('opt_steel')} (${fmtMoney(MATERIAL_PRICES[p.material]||MATERIAL_PRICES.steel)})</div></div>
            <div class="field"><label>${T('pending_desired')}</label><div>${p.desiredDate ? fmtDate(p.desiredDate) : '—'}</div></div>
            <div class="field"><label>${T('pending_contact')}</label><div>${p.email || '—'}${p.phone ? ' · '+p.phone : ''}${p.messenger ? ' · Messenger: '+p.messenger : ''}</div></div>
          </div>
          <div class="field" style="margin-bottom:10px;"><label>${T('pending_desc')}</label><div>${p.description || '—'}</div></div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary btn-sm pend-accept" data-id="${p.id}">${T('btn_accept')}</button>
            <button class="btn btn-danger btn-sm pend-reject" data-id="${p.id}">${T('btn_reject')}</button>
          </div>
        </div>
      `).join('')}
    </div>` : ''}
    <div class="card">
      <h2>${T('prod_queue_title')} ${queueLines.length ? `— ${totalQueueQty} ${T('prod_queue_summary')}` : ''}</h2>
      ${queueLines.length ? `
      <table>
        <thead><tr><th>${T('th_order_no')}</th><th>${T('th_customer')}</th><th>${T('th_product_col')}</th><th>${T('th_material_col')}</th><th style="text-align:right;">${T('th_qty_col')}</th><th>${T('th_status')}</th></tr></thead>
        <tbody>${queueRows}</tbody>
      </table>
      ` : `<div class="empty"><div class="stamp">${T('empty_generic')}</div><div>${T('empty_prod_queue')}</div></div>`}
    </div>
    <div class="card">
      <h2>${T('dash_list_title')}</h2>
      ${orders.length ? `
      <table>
        <thead><tr><th>${T('th_order_no')}</th><th>${T('th_customer')}</th><th>${T('th_due')}</th><th style="text-align:right;">${T('th_total')}</th><th>${T('th_status')}</th><th style="text-align:center;">${T('th_paid')}</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `
      <div class="empty">
        <div class="stamp">${T('empty_no_orders')}</div>
        <div>${T('empty_start_hint')}</div>
      </div>`}
    </div>
  `;
  renderShell(html);
  document.getElementById('go-new-order').addEventListener('click', ()=>{ state.route='new-order'; render(); });
  document.querySelectorAll('.pend-accept').forEach(b=>b.addEventListener('click', async ()=>{
    const p = state.pendingOrders.find(x=>x.id===b.dataset.id);
    if(!p) return;
    let customer = p.email ? state.customers.find(c=>c.email && c.email.toLowerCase()===p.email.toLowerCase()) : null;
    if(!customer){
      customer = { id: uid(), name: p.email || p.phone || 'Khách hàng', address:'', email: p.email||'' };
      state.customers.push(customer);
      await sSet('customers', state.customers);
    }
    state.counters.order += 1;
    const orderNumber = `${state.settings.orderPrefix}-${String(state.counters.order).padStart(4,'0')}`;
    const order = {
      id: uid(), orderNumber, date: todayISO(),
      customerId: customer.id, customerName: customer.name,
      lines: [{ productId:null, name: state.settings.uiLanguage==='sv' ? 'Bärskopa' : 'Cào xúc quả', material: p.material||'steel', qty:1, unitPrice: MATERIAL_PRICES[p.material]||MATERIAL_PRICES.steel }],
      status:'draft', vatRate: state.settings.vatRate,
      notes: (p.description||'') + (p.phone ? `\n${T('lbl_phone')}: ${p.phone}` : '') + (p.messenger ? `\nMessenger: ${p.messenger}` : ''),
      dueDate: null, deliveryDueDate: p.desiredDate || null,
      paid:false, paymentMethod:null, paymentDate:null,
      invoiceNumber:null, invoiceDate:null, referenceNumber:null,
    };
    state.orders.push(order);
    state.pendingOrders = state.pendingOrders.filter(x=>x.id!==p.id);
    await sSet('orders', state.orders);
    await sSet('counters', state.counters);
    await sSet('pendingOrders', state.pendingOrders);
    showToast(T('toast_pending_accepted'));
    render();
  }));
  document.querySelectorAll('.pend-reject').forEach(b=>b.addEventListener('click', async ()=>{
    state.pendingOrders = state.pendingOrders.filter(x=>x.id!==b.dataset.id);
    await sSet('pendingOrders', state.pendingOrders);
    showToast(T('toast_pending_rejected'));
    render();
  }));
  document.querySelectorAll('.act-view').forEach(b=>b.addEventListener('click', ()=>{ state.invoiceView = b.dataset.id; state.route='invoice'; render(); }));
  document.querySelectorAll('.act-del').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm(T('confirm_delete_order'))) return;
    state.orders = state.orders.filter(o=>o.id!==b.dataset.id);
    await sSet('orders', state.orders);
    showToast(T('toast_deleted_order')); render();
  }));
  document.querySelectorAll('.act-status').forEach(b=>b.addEventListener('click', async ()=>{
    const order = state.orders.find(o=>o.id===b.dataset.id);
    const seq = ['draft','production','completed','invoiced','paid'];
    const idx = seq.indexOf(order.status);
    order.status = seq[(idx+1)%seq.length];
    if(order.status==='invoiced' && !order.invoiceNumber){
      assignInvoiceNumber(order);
    }
    await sSet('orders', state.orders);
    await sSet('counters', state.counters);
    render();
    if(order.status==='completed'){
      sendCompletionEmail(order);
    }
  }));
  document.querySelectorAll('.act-paid').forEach(cb=>cb.addEventListener('change', async ()=>{
    const order = state.orders.find(o=>o.id===cb.dataset.id);
    order.paid = cb.checked;
    if(order.paid && !order.paymentDate){ order.paymentDate = todayISO(); }
    if(!order.paid){ order.paymentDate = null; order.paymentMethod = null; }
    await sSet('orders', state.orders);
    render();
  }));
}
function assignInvoiceNumber(order){
  state.counters.invoice += 1;
  const seqStr = String(state.counters.invoice).padStart(4,'0');
  order.invoiceNumber = `${state.settings.invoicePrefix}-${seqStr}`;
  order.invoiceDate = todayISO();
  order.dueDate = addDays(order.invoiceDate, state.settings.paymentTermsDays);
  // reference number based on invoice sequence, prefixed by nothing (pure digits per RF/national ref rules)
  const base = String(state.counters.invoice).padStart(6,'0');
  order.referenceNumber = finnishReference(base);
}

      <div id="lines"></div>

  function updateDueWeek(){
    const wk = getISOWeek(dueInput.value);
    dueWeekLabel.textContent = wk ? `${T('lbl_week_of')} ${wk}` : '';
  }
  dueInput.addEventListener('change', updateDueWeek);

  function renderLines(){
    const wrap = document.getElementById('lines');
    wrap.innerHTML = lines.map(l => `
      <div class="line-item-row" data-line="${l.id}">
        <div class="field" style="min-width:200px;">
          <label>${T('lbl_line_product')}</label>
          <select class="l-product">
            <option value="">${T('opt_manual_name')}</option>
            ${state.products.map(p=>`<option value="${p.id}" ${p.id===l.productId?'selected':''}>${p.name}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:170px;">
          <label>${T('lbl_line_name')}</label>
          <input type="text" class="l-name" value="${l.name}" placeholder="${T('ph_line_name')}">
        </div>
        <div class="field" style="min-width:150px;">
          <label>${T('lbl_material')}</label>
          <select class="l-material">
            <option value="steel" ${l.material==='steel'?'selected':''}>${T('opt_steel')} (${fmtMoney(MATERIAL_PRICES.steel)})</option>
            <option value="inox" ${l.material==='inox'?'selected':''}>${T('opt_inox')} (${fmtMoney(MATERIAL_PRICES.inox)})</option>
          </select>
        </div>
        <div class="field" style="max-width:90px;">
          <label>${T('lbl_line_qty')}</label>
          <input type="number" min="0" step="1" class="l-qty" value="${l.qty}">
        </div>
        <button class="rm" title="${T('btn_delete')}">✕</button>
      </div>
    `).join('');

    wrap.querySelectorAll('.line-item-row').forEach(row=>{
      const id = row.dataset.line;
      const line = lines.find(l=>l.id===id);
      row.querySelector('.l-product').addEventListener('change', e=>{
        const p = state.products.find(pp=>pp.id===e.target.value);
        line.productId = e.target.value;
        if(p){ line.name = p.name; }
        renderLines(); updateTotals();
      });
      row.querySelector('.l-name').addEventListener('input', e=>{ line.name = e.target.value; });
      row.querySelector('.l-material').addEventListener('change', e=>{ line.material = e.target.value; updateTotals(); });
      row.querySelector('.l-qty').addEventListener('input', e=>{ line.qty = parseFloat(e.target.value)||0; updateTotals(); });
      row.querySelector('.rm').addEventListener('click', ()=>{
        lines = lines.filter(l=>l.id!==id);
        if(lines.length===0) lines.push({ id: uid(), productId:'', name:'', material:'steel', qty:1 });
        renderLines(); updateTotals();
      });
    });
  }

  function updateTotals(){
    const subtotal = lines.reduce((a,l)=>a + (l.qty * (MATERIAL_PRICES[l.material]||0)), 0);
    const vatRate = state.settings.vatRate;
    const vat = subtotal * vatRate/100;

      <div class="row"><span>${T('tot_subtotal')}</span><span class="mono">${fmtMoney(subtotal)}</span></div>

      name:l.name || (state.products.find(p=>p.id===l.productId)?.name) || (state.settings.uiLanguage==='sv'?'Produkt':'Sản phẩm'),
      material: l.material||'steel',
      qty:l.qty,
      unitPrice: MATERIAL_PRICES[l.material] || 0,
    }));
    if(cleanLines.length===0){ alert(state.settings.uiLanguage==='sv' ? 'Lägg till minst en produkt.' : 'Vui lòng thêm ít nhất một sản phẩm.'); return; }

    state.counters.order += 1;
    const orderNumber = `${state.settings.orderPrefix}-${String(state.counters.order).padStart(4,'0')}`;

    const order = {
      id: uid(), orderNumber, date: document.getElementById('f-date').value || todayISO(),
      customerId, customerName, lines: cleanLines,
      status:'draft', vatRate: state.settings.vatRate,
      notes: document.getElementById('f-notes').value.trim(),
      dueDate: null,
      deliveryDueDate: document.getElementById('f-duedate').value || null,
      paid: false, paymentMethod: null, paymentDate: null,
      invoiceNumber:null, invoiceDate:null, referenceNumber:null,
    };
    state.orders.push(order);
    await sSet('orders', state.orders);
    await sSet('counters', state.counters);
    showToast(T('toast_saved_order') + ' ' + orderNumber);
    state.route='dashboard'; render();
  });
}

function purchaseTotal(p){
  const amount = p.amount || 0;
  const vat = amount * (p.vatRate ?? 0) / 100;
  return { amount, vat, total: amount + vat };
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showImageModal(src){

    <div style="text-align:right;margin-bottom:8px;"><button class="btn btn-ghost btn-sm" id="img-modal-close" style="background:#fff;">${T('close_x')}</button></div>
    <img src="${src}" style="max-width:100%;max-height:80vh;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.3);">
  </div>`;
  document.body.appendChild(backdrop);
  const close = ()=> backdrop.remove();
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });
  backdrop.querySelector('#img-modal-close').addEventListener('click', close);
}

function csvEscape(v){
  const s = String(v ?? '');
  return /[;\n"]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function renderBokforing(){
  const ledgerOrders = state.orders.filter(o=>o.invoiceNumber).sort((a,b)=>(a.invoiceDate||'').localeCompare(b.invoiceDate||''));

  const months = Array.from(new Set(ledgerOrders.map(o=>(o.invoiceDate||'').slice(0,7)))).sort().reverse();
  const currentFilter = state.bokforingMonth ?? 'all';

  const filtered = currentFilter==='all' ? ledgerOrders : ledgerOrders.filter(o=>(o.invoiceDate||'').slice(0,7)===currentFilter);
  const filteredPurchases = currentFilter==='all' ? state.purchases : state.purchases.filter(p=>(p.date||'').slice(0,7)===currentFilter);

  const incomeSums = filtered.reduce((a,o)=>{ const t=orderTotal(o); a.subtotal+=t.subtotal; a.vat+=t.vat; a.total+=t.total; return a; }, {subtotal:0,vat:0,total:0});
  const purchaseSums = filteredPurchases.reduce((a,p)=>{ const t=purchaseTotal(p); a.amount+=t.amount; a.vat+=t.vat; a.total+=t.total; return a; }, {amount:0,vat:0,total:0});
  const netResult = incomeSums.total - purchaseSums.total;

  const purchaseRows = filteredPurchases.map(p=>{
    const t = purchaseTotal(p);
    return `<tr>
      <td class="mono">${fmtDate(p.date)}</td>
      <td>${p.supplier||'—'}</td>
      <td>${p.description||'—'}</td>
      <td class="num">${fmtMoney(t.amount)}</td>
      <td class="num">${fmtMoney(t.vat)}</td>
      <td class="num">${fmtMoney(t.total)}</td>

  }).join('');

  const rows = filtered.map(o=>{
    const t = orderTotal(o);
    return `<tr>
      <td class="mono">${o.invoiceNumber}</td>
      <td class="mono">${fmtDate(o.invoiceDate)}</td>
      <td>${o.customerName}</td>
      <td class="num">${fmtMoney(t.subtotal)}</td>
      <td class="num">${fmtMoney(t.vat)}</td>
      <td class="num">${fmtMoney(t.total)}</td>
      <td><span class="status-badge status-${o.status}">${statusLabel(o.status)}</span></td>
    </tr>`;
  }).join('');

  const sums = incomeSums;

  const html = `
    <div class="topbar">
      <div><h1>${T('bf_title')}</h1><div class="meta">${T('bf_meta')}</div></div>
      <div style="display:flex;gap:10px;align-items:center;">
        <select id="bf-month" class="mono">
          <option value="all" ${currentFilter==='all'?'selected':''}>${T('bf_all')}</option>
          ${months.map(m=>`<option value="${m}" ${m===currentFilter?'selected':''}>${m}</option>`).join('')}
        </select>
        <button class="btn btn-ghost" id="bf-export">${T('btn_export_csv')}</button>
      </div>
    </div>

    <div class="card">
      <h2>${T('bf_summary_title')}</h2>
      <div class="field-row">
        <div class="field">
          <label>${T('bf_received')}</label>
          <div class="mono" style="font-size:20px;color:var(--forest);">${fmtMoney(incomeSums.total)}</div>
        </div>
        <div class="field">
          <label>${T('bf_bought')}</label>
          <div class="mono" style="font-size:20px;color:var(--rust);">${fmtMoney(purchaseSums.total)}</div>
        </div>
        <div class="field">
          <label>${T('bf_result')}</label>
          <div class="mono" style="font-size:20px;color:${netResult>=0?'var(--forest)':'var(--rust)'};">${fmtMoney(netResult)}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>${T('bf_invoice_ledger')} (${filtered.length})</h2>
      ${filtered.length ? `
      <table>
        <thead><tr><th>Laskunro</th><th>Päivämäärä</th><th>Asiakas</th><th style="text-align:right;">Veroton</th><th style="text-align:right;">ALV</th><th style="text-align:right;">Yhteensä</th><th>Tila</th></tr></thead>
        <tbody>${rows}</tbody>

      <div class="totals">
        <div class="row"><span>Veroton yhteensä</span><span class="mono">${fmtMoney(sums.subtotal)}</span></div>
        <div class="row"><span>ALV yhteensä</span><span class="mono">${fmtMoney(sums.vat)}</span></div>
        <div class="row grand"><span>Yhteensä</span><span class="mono">${fmtMoney(sums.total)}</span></div>

      ${filteredPurchases.length ? `

        <thead><tr><th>Päivämäärä</th><th>${T('th_supplier')}</th><th>${T('th_desc')}</th><th style="text-align:right;">${T('th_amount')}</th><th style="text-align:right;">ALV</th><th style="text-align:right;">Yhteensä</th></tr></thead>
        <tbody>${purchaseRows}</tbody>

      <div class="totals">
        <div class="row"><span>${T('tot_amount_sum')}</span><span class="mono">${fmtMoney(purchaseSums.amount)}</span></div>
        <div class="row"><span>ALV yhteensä</span><span class="mono">${fmtMoney(purchaseSums.vat)}</span></div>
        <div class="row grand"><span>${T('tot_bought')}</span><span class="mono">${fmtMoney(purchaseSums.total)}</span></div>

  renderShell(html);

  document.getElementById('bf-month').addEventListener('change', e=>{
    state.bokforingMonth = e.target.value;
    render();
  });

  document.getElementById('bf-export').addEventListener('click', ()=>{
    const header = ['Laskunro','Päivämäärä','Eräpäivä','Asiakas','Viitenumero','Veroton','ALV%','ALV','Yhteensä','Tila'];
    const lines = [header.join(';')];
    filtered.forEach(o=>{
      const t = orderTotal(o);
      lines.push([
        o.invoiceNumber, o.invoiceDate, o.dueDate, o.customerName, o.referenceNumber,
        t.subtotal.toFixed(2), (o.vatRate ?? state.settings.vatRate), t.vat.toFixed(2), t.total.toFixed(2), statusLabel(o.status)
      ].map(csvEscape).join(';'));
    });
    const blob = new Blob(['\uFEFF' + lines.join('\n')], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bokforing_${currentFilter}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

}
// ---------------- Invoice view ----------------
function renderInvoice(){
  const order = state.orders.find(o=>o.id===state.invoiceView);
  if(!order){ state.route='dashboard'; render(); return; }
  if(!order.invoiceNumber){ assignInvoiceNumber(order); }
  const s = state.settings;
  const t = orderTotal(order);
  const customer = state.customers.find(c=>c.id===order.customerId);
  const L = invLang();

  const rows = order.lines.map(l=>`
    <tr>
      <td>${l.name}${l.material ? ` <span class="meta" style="font-size:11px;">(${l.material==='inox'?T('opt_inox'):T('opt_steel')})</span>` : ''}</td>
      <td class="num">${l.qty}</td>
      <td class="num">${fmtMoney(l.unitPrice)}</td>
      <td class="num">${fmtMoney(l.qty*l.unitPrice)}</td>
    </tr>`).join('');

  const refFormatted = order.referenceNumber ? formatReference(order.referenceNumber) : '—';

  const html = `
    <div class="topbar no-print">
      <div><h1>${T('inv_title')} ${order.invoiceNumber}</h1><div class="meta">${T('inv_order')} ${order.orderNumber} — ${order.customerName}</div></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" id="back-btn">${T('btn_back')}</button>
        <button class="btn btn-primary" id="print-btn">${T('btn_print')}</button>
      </div>
    </div>

    <div class="card no-print">
      <h2>${T('inv_delivery_title')}</h2>
      <div class="field-row">
        <div class="field" style="max-width:220px;">
          <label>${T('lbl_due_date')}</label>
          <input type="date" id="delivery-date" value="${order.deliveryDueDate || ''}">
          <div class="meta" id="delivery-week" style="margin-top:4px;">${order.deliveryDueDate ? `${T('lbl_week_of')} ${getISOWeek(order.deliveryDueDate)}` : ''}</div>
        </div>
        <div class="field" style="justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" id="delivery-save" style="width:fit-content;">${T('btn_save_delivery')}</button>
        </div>
      </div>
    </div>

    <div class="card no-print">
      <h2>${T('inv_payment_title')}</h2>
      <div class="field-row">
        <div class="field" style="justify-content:flex-end;">
          <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;color:var(--ink);">
            <input type="checkbox" id="pay-check" style="width:auto;" ${order.paid?'checked':''}> ${T('lbl_paid_check')}
          </label>
        </div>
        <div class="field" style="max-width:200px;">
          <label>${T('lbl_payment_method')}</label>
          <select id="pay-method">
            <option value="bank" ${order.paymentMethod==='bank'?'selected':''}>${T('opt_bank')}</option>
            <option value="cash" ${order.paymentMethod==='cash'?'selected':''}>${T('opt_cash')}</option>
          </select>
        </div>
        <div class="field" style="max-width:200px;">
          <label>${T('lbl_payment_date')}</label>
          <input type="date" id="pay-date" value="${order.paymentDate || ''}">
        </div>
        <div class="field" style="justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" id="pay-save" style="width:fit-content;">${T('btn_save_payment')}</button>
        </div>
      </div>
      <div style="margin-top:12px;">
        <button class="btn btn-ghost btn-sm" id="resend-completion-btn">${T('btn_resend_completion')}</button>
      </div>
    </div>

    <div class="invoice-sheet">
      <div class="inv-head">
        <div class="company">
          <img src="${LOGO_DATA_URI}" alt="${s.companyName}" style="height:34px;width:auto;margin-bottom:10px;display:block;">
          <strong>${s.companyName}</strong><br>
          ${s.address}${s.address?', ':''}${s.postal} ${s.city}<br>

          ${s.phone ? L.phone+': '+s.phone+'<br>' : ''}
          ${s.email ? s.email : ''}
        </div>
        <div class="doc-title">
          <div class="t">${L.docTitle}</div>

      </div>

      <div class="inv-meta-grid">
        <div class="block">
          <h4>${L.billedTo}</h4>
          <div class="kv"><span>${L.name}</span><span>${order.customerName}</span></div>
          ${customer?.address ? `<div class="kv"><span>${L.address}</span><span>${customer.address}</span></div>` : ''}

        <div class="block">
          <h4>${L.invoiceDetails}</h4>
          <div class="kv"><span>${L.invoiceDate}</span><span class="mono">${fmtDate(order.invoiceDate)}</span></div>

        <div class="row"><span>${L.subtotal}</span><span class="mono">${fmtMoney(t.subtotal)}</span></div>
        <div class="row"><span>${L.vat} (${order.vatRate ?? s.vatRate}%)</span><span class="mono">${fmtMoney(t.vat)}</span></div>
        <div class="row grand"><span>${L.grandTotal}</span><span class="mono">${fmtMoney(t.total)}</span></div>

      <div class="inv-pay">

        ${s.bic ? `<div class="kv"><span>BIC</span><span class="mono">${s.bic}</span></div>` : ''}
        <div class="kv"><span>${L.refNo}</span><span class="mono">${refFormatted}</span></div>
        <div class="kv big"><span>${L.dueDate} ${fmtDate(order.dueDate)}</span><span class="mono">${fmtMoney(t.total)}</span></div>
        ${order.paid ? `<div class="kv" style="color:var(--forest);"><span>${T('lbl_paid_check')}</span><span class="mono">${fmtDate(order.paymentDate)} · ${order.paymentMethod==='cash'?T('opt_cash'):T('opt_bank')}</span></div>` : ''}

  `;
  renderShell(html);
  document.getElementById('back-btn').addEventListener('click', async ()=>{
    await sSet('orders', state.orders);
    await sSet('counters', state.counters);
    state.route='dashboard'; render();
  });
  document.getElementById('print-btn').addEventListener('click', async ()=>{
    await sSet('orders', state.orders);
    await sSet('counters', state.counters);
    window.print();
  });
  document.getElementById('pay-save').addEventListener('click', async ()=>{
    order.paid = document.getElementById('pay-check').checked;
    order.paymentMethod = document.getElementById('pay-method').value;
    order.paymentDate = document.getElementById('pay-date').value || (order.paid ? todayISO() : null);
    if(!order.paid){ order.paymentDate = null; }
    await sSet('orders', state.orders);
    showToast(T('toast_saved_payment'));
    render();
  });
  const deliveryInput = document.getElementById('delivery-date');
  deliveryInput.addEventListener('change', ()=>{
    const wk = getISOWeek(deliveryInput.value);
    document.getElementById('delivery-week').textContent = wk ? `${T('lbl_week_of')} ${wk}` : '';
  });
  document.getElementById('delivery-save').addEventListener('click', async ()=>{
    order.deliveryDueDate = deliveryInput.value || null;
    await sSet('orders', state.orders);
    showToast(T('toast_saved_delivery'));
    render();
  });
  document.getElementById('resend-completion-btn').addEventListener('click', ()=>{
    const c = state.customers.find(cc=>cc.id===order.customerId);
    if(!c?.email){ showToast(T('no_customer_email')); return; }
    sendCompletionEmail(order);
  });
}

// ---------------- Access lock (Google + PIN) ----------------
function decodeJwtPayload(token){
  try{
    const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}

function handleGoogleCredential(response){
  const payload = decodeJwtPayload(response.credential);
  const err = document.getElementById('lock-error');
  if(!payload || !payload.email){
    if(err) err.textContent = T('err_no_email');
    return;
  }
  const allowed = (state.settings.adminEmails||'').split(',').map(e=>e.trim().toLowerCase()).filter(Boolean);
  if(allowed.length===0 || allowed.includes(payload.email.toLowerCase())){
    state.googleUser = { email: payload.email, name: payload.name, picture: payload.picture };
    requestDriveAccess();
  } else {
    if(err) err.textContent = T('err_no_access').replace('{email}', payload.email);
  }
}

function requestDriveAccess(){
  const err = document.getElementById('lock-error');
  if(err){ err.style.color = 'var(--ink-soft)'; err.textContent = T('err_drive_connecting'); }
  try{
    const tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.settings.googleClientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: async (tokenResponse)=>{
        if(!tokenResponse || tokenResponse.error){
          if(err){ err.style.color = 'var(--rust)'; err.textContent = T('err_drive_failed'); }
          return;
        }
        driveAccessToken = tokenResponse.access_token;
        driveDoc = null; driveFileId = null; driveLoadPromise = null;
        state.unlocked = true;
        state.loading = true;
        render();
        await loadAll();
      }
    });
    tokenClient.requestAccessToken();
  }catch(e){
    console.error(e);
    if(err){ err.style.color = 'var(--rust)'; err.textContent = T('err_drive_init_failed'); }
  }
}

function initGoogleButton(){
  if(!window.google || !state.settings.googleClientId) return;
  try{
    google.accounts.id.initialize({
      client_id: state.settings.googleClientId,
      callback: handleGoogleCredential,
    });
    const target = document.getElementById('google-btn-slot');
    if(target){
      google.accounts.id.renderButton(target, { theme:'outline', size:'large', width:280, text:'signin_with' });
    }
  }catch(e){ console.error('Google init failed', e); }
}

function renderLock(){
  const app = document.getElementById('app');
  const hasGoogle = !!(state.settings.googleClientId);

  app.innerHTML = `
    <div class="lock-screen">
      <div class="lock-card">
        <img src="${LOGO_DATA_URI}" style="height:36px;margin-bottom:16px;">
        <h2>${T('lock_title')}</h2>
        <div class="meta" style="margin-bottom:18px;">${hasGoogle ? T('lock_meta_google') : T('lock_meta_noconfig')}</div>
        ${hasGoogle ? `<div id="google-btn-slot" style="display:flex;justify-content:center;margin-bottom:6px;"></div>` : ''}
        <div id="lock-error" style="color:var(--rust);font-size:12px;margin-top:10px;min-height:16px;"></div>
        <div style="margin-top:16px;font-size:12px;color:var(--ink-soft);cursor:pointer;" id="lock-lang-toggle">🌐 ${state.settings.uiLanguage==='sv' ? 'Vietnamesiska' : 'Svenska'}</div>
      </div>
    </div>`;
  document.getElementById('lock-lang-toggle').addEventListener('click', ()=>{
    state.settings.uiLanguage = state.settings.uiLanguage==='sv' ? 'vi' : 'sv';
    render();
  });
  if(hasGoogle) waitForGoogleReady(initGoogleButton);
}

function waitForGoogleReady(cb, attempts){
  attempts = attempts || 0;
  if(window.google && window.google.accounts && window.google.accounts.id){
    cb();
  } else if(attempts < 60){
    setTimeout(()=>waitForGoogleReady(cb, attempts+1), 150);
  } else {
    const slot = document.getElementById('google-btn-slot');
    if(slot) slot.innerHTML = `<div style="font-size:12px;color:var(--rust);">${T('err_google_load_failed')}</div>`;
  }
}

// ---------------- Router ----------------
function render(){
  if(state.loading){
    document.getElementById('app').innerHTML = `<div style="padding:60px;text-align:center;color:#54615A;">${T('loading')}</div>`;
    return;
  }
  if(!state.unlocked){ return renderLock(); }
  if(state.route==='dashboard') return renderDashboard();
  if(state.route==='new-order') return renderNewOrder();
  if(state.route==='products') return renderProducts();
  if(state.route==='customers') return renderCustomers();
  if(state.route==='customer-detail') return renderCustomerDetail();
  if(state.route==='purchases') return renderPurchases();
  if(state.route==='bokforing') return renderBokforing();
  if(state.route==='settings') return renderSettings();
  if(state.route==='invoice') return renderInvoice();
  renderDashboard();
}

loadAll();
</script>
