<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ tính tiền thu mua</title>
<style>
  :root{
    --plum:#4A1942;
    --plum-light:#6B2D5C;
    --cream:#FAF5EC;
    --card:#FFFFFF;
    --gold:#B8892B;
    --gold-light:#F3E4C4;
    --leaf:#4F7A57;
    --ink:#2B2320;
    --ink-soft:#77675E;
    --line:#E7DCC9;
    --danger:#B2413A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--cream);
    color:var(--ink);
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;position:relative;}

  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;position:relative;}
  .menu-btn{
    background:var(--card);border:1px solid var(--line);border-radius:9px;
    width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .menu-btn span{display:block;width:18px;height:2px;background:var(--plum);position:relative;}
  .menu-btn span::before,.menu-btn span::after{content:'';position:absolute;left:0;width:18px;height:2px;background:var(--plum);}
  .menu-btn span::before{top:-6px;}
  .menu-btn span::after{top:6px;}
  .menu-btn:hover{background:var(--gold-light);}
  .topbar h1{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;color:var(--plum);margin:0;}
  .topbar .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}

  .dropdown{
    position:absolute;top:50px;left:0;background:var(--card);border:1px solid var(--line);
    border-radius:12px;min-width:230px;padding:8px;z-index:20;display:none;
    box-shadow:0 6px 20px rgba(74,25,66,0.12);
  }
  .dropdown.open{display:block;}
  .dropdown button{
    width:100%;text-align:left;background:none;border:none;padding:12px 12px;font-size:14.5px;
    font-weight:600;color:var(--ink);border-radius:8px;display:flex;align-items:center;gap:10px;
  }
  .dropdown button:hover{background:var(--gold-light);}
  .dropdown .ic{width:26px;height:26px;flex:none;border-radius:7px;background:var(--gold-light);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--plum);}

  .page{display:none;}
  .page.active{display:block;}

  .landing{text-align:center;padding:50px 10px 10px;}
  .landing img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--card);box-shadow:0 4px 16px rgba(74,25,66,0.15);}
  .landing h1{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:700;color:var(--plum);margin:20px 0 4px;}
  .landing .tag{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:26px;}
  .landing .go-btn{background:var(--plum);color:#fff;padding:13px 26px;}
  .landing .go-btn:hover{background:var(--plum-light);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;}
  .card h2{font-size:15px;margin:0 0 16px;color:var(--plum-light);font-weight:700;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#FFFDF9;color:var(--ink);}
  input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-light);}
  .total-box{display:flex;align-items:center;justify-content:space-between;background:var(--gold-light);border-radius:10px;padding:14px 16px;margin:14px 0 16px;}
  .total-box .label{font-size:13px;color:#6B4E17;}
  .total-box .value{font-size:24px;font-weight:700;color:#6B4E17;}
  button{cursor:pointer;border:none;border-radius:9px;font-size:15px;font-weight:600;padding:12px 18px;}
  .btn-save{width:100%;background:var(--plum);color:#fff;}
  .btn-save:hover{background:var(--plum-light);}
  .btn-save:disabled{background:#C9B8C5;cursor:not-allowed;}
  .form-msg{font-size:13px;margin:-6px 0 12px;display:none;}
  .form-msg.show{display:block;}
  .form-msg.ok{color:var(--leaf);}
  .form-msg.err{color:var(--danger);}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .stat .num{font-size:20px;font-weight:700;color:var(--leaf);}
  .stat .lbl{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .search{width:100%;margin-bottom:14px;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:9px 6px;font-size:13.5px;border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft);font-weight:600;font-size:12px;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .del{background:none;border:none;color:var(--danger);font-size:12px;padding:4px 8px;}
  .empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:14px;}
  .toolbar{display:flex;gap:10px;margin-bottom:12px;}
  .toolbar button{background:var(--card);border:1px solid var(--line);color:var(--plum);font-size:13px;padding:8px 14px;}
  .toolbar button:hover{background:var(--gold-light);}
  .change-pwd-link{background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;padding:0 0 14px;}
  @media(max-width:480px){.summary{grid-template-columns:1fr 1fr;}.row{grid-template-columns:1fr;}}

  .modal-overlay{position:fixed;inset:0;background:rgba(43,35,32,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--card);border-radius:14px;padding:24px;width:100%;max-width:340px;}
  .modal-box h3{margin:0 0 6px;font-size:17px;color:var(--plum);font-family:Georgia,'Times New Roman',serif;}
  .modal-box p{margin:0 0 16px;font-size:13px;color:var(--ink-soft);}
  .modal-box input{margin-bottom:12px;}
  .modal-err{color:var(--danger);font-size:12.5px;margin:-6px 0 12px;display:none;}
  .modal-err.show{display:block;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn-primary{flex:1;background:var(--plum);color:#fff;}
  .modal-actions .btn-primary:hover{background:var(--plum-light);}
  .modal-actions .btn-cancel{flex:none;background:var(--cream);color:var(--ink-soft);}
  .modal-forgot{display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--ink-soft);text-decoration:underline;background:none;border:none;padding:4px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="page page-landing active" id="pageLanding">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn1" aria-label="Mở menu" title="Mở menu"><span></span></button>
    </div>
    <div class="landing">
      <img src="https://images.unsplash.com/photo-1560807707-8cc77767d783?w=300&h=300&fit=crop" alt="Thu mua nông sản">
      <h1>Sổ tính tiền thu mua</h1>
      <div class="tag">Tính tiền theo kg · lưu trên server thật</div>
      <button class="go-btn" id="goCalcBtn">Bắt đầu tính tiền</button>
    </div>
  </div>

  <div class="page page-calc" id="pageCalc">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn2" aria-label="Mở menu" title="Mở menu"><span></span></button>
      <div><h1>Sổ tính tiền</h1><div class="tag">Nhập hóa đơn mới</div></div>
    </div>
    <div class="card">
      <h2>Hóa đơn mới</h2>
      <div class="row">
        <div><label for="name">Tên khách hàng</label><input id="name" type="text" placeholder="Nguyễn Văn A"></div>
        <div><label for="kg">Số kg</label><input id="kg" type="number" step="0.01" min="0" placeholder="0"></div>
      </div>
      <div class="row">
        <div><label for="price">Đơn giá (kr / kg)</label><input id="price" type="number" step="0.01" min="0" placeholder="0"></div>
        <div><label for="date">Ngày</label><input id="date" type="date"></div>
      </div>
      <div class="total-box"><span class="label">Thành tiền</span><span class="value" id="totalPreview">0 kr</span></div>
      <div class="form-msg" id="formMsg"></div>
      <button class="btn-save" id="saveBtn">Lưu hóa đơn</button>
    </div>
  </div>

  <div class="page page-history" id="pageHistory">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn3" aria-label="Mở menu" title="Mở menu"><span></span></button>
      <div><h1>Lịch sử giao dịch</h1><div class="tag">Toàn bộ hóa đơn đã lưu</div></div>
    </div>
    <div class="summary">
      <div class="stat"><div class="num" id="statCount">0</div><div class="lbl">Hóa đơn</div></div>
      <div class="stat"><div class="num" id="statKg">0</div><div class="lbl">Tổng kg</div></div>
      <div class="stat"><div class="num" id="statMoney">0</div><div class="lbl">Tổng tiền (kr)</div></div>
    </div>
    <div class="card">
      <button class="change-pwd-link" id="changePwdLink">Đổi mật khẩu</button>
      <button class="change-pwd-link" id="logoutLink" style="float:right">Đăng xuất</button>
      <input class="search" type="text" id="search" placeholder="Tìm theo tên khách hàng...">
      <div class="toolbar">
        <button id="exportBtn">Xuất CSV</button>
        <button id="clearBtn">Xóa tất cả</button>
      </div>
      <div id="historyWrap"></div>
    </div>
  </div>

  <div class="dropdown" id="dropdownMenu">
    <button data-page="calc"><span class="ic">&#8595;</span> Sổ tính tiền</button>
    <button data-page="history"><span class="ic">&#9776;</span> Lịch sử giao dịch</button>
  </div>

  <div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>

</div>

<script>
const API = '';

async function api(path, method, body){
  const res = await fetch(API + path, {
    method: method || 'GET',
    headers: body ? {'Content-Type':'application/json'} : undefined,
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin'
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  return { ok: res.ok, status: res.status, data };
}

const nameEl = document.getElementById('name');
const kgEl = document.getElementById('kg');
const priceEl = document.getElementById('price');
const dateEl = document.getElementById('date');
const totalPreview = document.getElementById('totalPreview');
const saveBtn = document.getElementById('saveBtn');
const searchEl = document.getElementById('search');
const formMsg = document.getElementById('formMsg');

dateEl.value = new Date().toISOString().slice(0,10);

function formatMoney(n){ return Math.round(n).toLocaleString('vi-VN') + ' kr'; }
function formatNum(n, decimals){ return n.toLocaleString('vi-VN', {maximumFractionDigits: decimals || 0}); }
function currentTotal(){
  const kg = parseFloat(kgEl.value) || 0;
  const price = parseFloat(priceEl.value) || 0;
  return kg * price;
}
function updatePreview(){ totalPreview.textContent = formatMoney(currentTotal()); }
kgEl.addEventListener('input', updatePreview);
priceEl.addEventListener('input', updatePreview);

function showFormMsg(text, ok){
  formMsg.textContent = text;
  formMsg.className = 'form-msg show ' + (ok ? 'ok' : 'err');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

let invoicesCache = [];

function renderHistory(){
  const q = searchEl.value.trim().toLowerCase();
  const filtered = invoicesCache.filter(inv => inv.name.toLowerCase().includes(q));

  const totalCount = invoicesCache.length;
  const totalKg = invoicesCache.reduce((s,i)=>s+i.kg,0);
  const totalMoney = invoicesCache.reduce((s,i)=>s+i.total,0);
  document.getElementById('statCount').textContent = totalCount;
  document.getElementById('statKg').textContent = formatNum(totalKg, 1);
  document.getElementById('statMoney').textContent = formatNum(totalMoney, 0);

  const wrap = document.getElementById('historyWrap');
  if(filtered.length === 0){
    wrap.innerHTML = '<div class="empty">Chưa có hóa đơn nào. Vào "Sổ tính tiền" để nhập hóa đơn đầu tiên.</div>';
    return;
  }
  const sorted = [...filtered].reverse();
  let rows = sorted.map(inv => `
    <tr>
      <td>${inv.date}</td>
      <td>${escapeHtml(inv.name)}</td>
      <td class="num">${formatNum(inv.kg,2)}</td>
      <td class="num">${formatNum(inv.price,2)}</td>
      <td class="num">${formatMoney(inv.total)}</td>
      <td><button class="del" data-id="${inv.id}">Xóa</button></td>
    </tr>`).join('');
  wrap.innerHTML = `<table><thead><tr><th>Ngày</th><th>Khách hàng</th><th>Kg</th><th>Đơn giá</th><th>Thành tiền</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  wrap.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await api('/api/invoices/' + btn.getAttribute('data-id'), 'DELETE');
      await loadInvoices();
    });
  });
}

async function loadInvoices(){
  const r = await api('/api/invoices', 'GET');
  if(r.ok){
    invoicesCache = r.data;
    renderHistory();
  }else if(r.status === 401){
    goToPage('landing');
    openHistoryProtected();
  }
}

saveBtn.addEventListener('click', async ()=>{
  const name = nameEl.value.trim();
  const kg = parseFloat(kgEl.value);
  const price = parseFloat(priceEl.value);
  const date = dateEl.value || new Date().toISOString().slice(0,10);

  if(!name){ nameEl.focus(); return; }
  if(!kg || kg <= 0){ kgEl.focus(); return; }
  if(!price || price <= 0){ priceEl.focus(); return; }

  saveBtn.disabled = true;
  const r = await api('/api/invoices', 'POST', { name, kg, price, date });
  saveBtn.disabled = false;

  if(r.ok){
    nameEl.value = ''; kgEl.value = ''; priceEl.value = '';
    updatePreview();
    showFormMsg('Đã lưu hóa đơn.', true);
    nameEl.focus();
  }else{
    showFormMsg((r.data && r.data.error) || 'Có lỗi, thử lại.', false);
  }
});

document.getElementById('clearBtn').addEventListener('click', async ()=>{
  if(confirm('Xóa toàn bộ lịch sử giao dịch? Không thể hoàn tác.')){
    await api('/api/invoices', 'DELETE');
    await loadInvoices();
  }
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(invoicesCache.length === 0){ alert('Chưa có dữ liệu để xuất.'); return; }
  const header = 'Ngay,Ten khach hang,So kg,Don gia,Thanh tien\n';
  const rows = invoicesCache.map(i => `${i.date},"${i.name}",${i.kg},${i.price},${i.total}`).join('\n');
  const blob = new Blob([header + rows], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lich-su-giao-dich.csv'; a.click();
  URL.revokeObjectURL(url);
});

searchEl.addEventListener('input', renderHistory);

// ---- dieu huong trang + modal mat khau ----
const pages = {
  landing: document.getElementById('pageLanding'),
  calc: document.getElementById('pageCalc'),
  history: document.getElementById('pageHistory')
};
const dropdown = document.getElementById('dropdownMenu');
const modalOverlay = document.getElementById('modalOverlay');
const modalBox = document.getElementById('modalBox');

function closeModal(){ modalOverlay.classList.remove('open'); modalBox.innerHTML=''; }

function showSetPasswordModal(onSuccess){
  modalBox.innerHTML = `
    <h3>Đặt mật khẩu</h3>
    <p>Bảo vệ trang lịch sử giao dịch bằng mật khẩu (lưu trên server).</p>
    <input type="password" id="pwd1" placeholder="Mật khẩu mới">
    <input type="password" id="pwd2" placeholder="Nhập lại mật khẩu">
    <div class="modal-err" id="pwdErr">Mật khẩu không khớp hoặc quá ngắn (tối thiểu 4 ký tự).</div>
    <div class="modal-actions">
      <button class="btn-cancel" id="pwdCancel">Hủy</button>
      <button class="btn-primary" id="pwdSet">Lưu mật khẩu</button>
    </div>`;
  modalOverlay.classList.add('open');
  document.getElementById('pwd1').focus();
  document.getElementById('pwdCancel').addEventListener('click', closeModal);
  document.getElementById('pwdSet').addEventListener('click', async ()=>{
    const p1 = document.getElementById('pwd1').value;
    const p2 = document.getElementById('pwd2').value;
    const err = document.getElementById('pwdErr');
    if(!p1 || p1 !== p2 || p1.length < 4){ err.classList.add('show'); return; }
    const r = await api('/api/set-password', 'POST', { password: p1 });
    if(r.ok){ closeModal(); onSuccess(); } else { err.classList.add('show'); }
  });
}

function showEnterPasswordModal(onSuccess){
  modalBox.innerHTML = `
    <h3>Nhập mật khẩu</h3>
    <p>Trang lịch sử giao dịch được bảo vệ.</p>
    <input type="password" id="pwdEnter" placeholder="Mật khẩu">
    <div class="modal-err" id="pwdEnterErr">Mật khẩu không đúng.</div>
    <div class="modal-actions">
      <button class="btn-cancel" id="pwdEnterCancel">Hủy</button>
      <button class="btn-primary" id="pwdEnterOk">Mở khóa</button>
    </div>
    <button class="modal-forgot" id="pwdForgot">Quên mật khẩu?</button>`;
  modalOverlay.classList.add('open');
  const input = document.getElementById('pwdEnter');
  input.focus();
  document.getElementById('pwdEnterCancel').addEventListener('click', closeModal);
  async function trySubmit(){
    const err = document.getElementById('pwdEnterErr');
    const r = await api('/api/login', 'POST', { password: input.value });
    if(r.ok){ closeModal(); onSuccess(); } else { err.classList.add('show'); }
  }
  document.getElementById('pwdEnterOk').addEventListener('click', trySubmit);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') trySubmit(); });
  document.getElementById('pwdForgot').addEventListener('click', async ()=>{
    if(confirm('Đặt lại mật khẩu? Bạn sẽ cần tạo mật khẩu mới. Dữ liệu hóa đơn vẫn được giữ nguyên.')){
      await api('/api/reset-password', 'POST');
      closeModal();
      showSetPasswordModal(onSuccess);
    }
  });
}

async function openHistoryProtected(){
  const r = await api('/api/status', 'GET');
  if(r.ok && r.data.authed){
    goToPage('history', true);
    return;
  }
  if(r.ok && !r.data.hasPassword){
    showSetPasswordModal(()=> goToPage('history', true));
  }else{
    showEnterPasswordModal(()=> goToPage('history', true));
  }
}

function goToPage(name, skipGuard){
  if(name === 'history' && !skipGuard){
    dropdown.classList.remove('open');
    openHistoryProtected();
    return;
  }
  Object.values(pages).forEach(p => p.classList.remove('active'));
  pages[name].classList.add('active');
  dropdown.classList.remove('open');
  if(name === 'history') loadInvoices();
}

document.getElementById('goCalcBtn').addEventListener('click', ()=> goToPage('calc'));

document.getElementById('changePwdLink').addEventListener('click', ()=>{
  modalBox.innerHTML = `
    <h3>Đổi mật khẩu</h3>
    <p>Nhập mật khẩu mới cho trang lịch sử.</p>
    <input type="password" id="cp1" placeholder="Mật khẩu mới">
    <input type="password" id="cp2" placeholder="Nhập lại mật khẩu mới">
    <div class="modal-err" id="cpErr">Mật khẩu không khớp hoặc quá ngắn.</div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cpCancel">Hủy</button>
      <button class="btn-primary" id="cpSave">Lưu</button>
    </div>`;
  modalOverlay.classList.add('open');
  document.getElementById('cpCancel').addEventListener('click', closeModal);
  document.getElementById('cpSave').addEventListener('click', async ()=>{
    const p1 = document.getElementById('cp1').value;
    const p2 = document.getElementById('cp2').value;
    const err = document.getElementById('cpErr');
    if(!p1 || p1 !== p2 || p1.length < 4){ err.classList.add('show'); return; }
    const r = await api('/api/change-password', 'POST', { newPassword: p1 });
    if(r.ok){ closeModal(); } else { err.classList.add('show'); }
  });
});

document.getElementById('logoutLink').addEventListener('click', async ()=>{
  await api('/api/logout', 'POST');
  goToPage('landing');
});

['menuBtn1','menuBtn2','menuBtn3'].forEach(id=>{
  document.getElementById(id).addEventListener('click', (e)=>{
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });
});
dropdown.querySelectorAll('button[data-page]').forEach(btn=>{
  btn.addEventListener('click', ()=> goToPage(btn.getAttribute('data-page')));
});
document.addEventListener('click', (e)=>{
  if(!dropdown.contains(e.target) && dropdown.classList.contains('open')) dropdown.classList.remove('open');
});

updatePreview();
</script>
</body>
</html>
